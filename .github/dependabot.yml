version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/ts
    schedule: { interval: weekly }
    ignore:
      # typescript-eslint peer-requires typescript <6.1
      - dependency-name: typescript
        versions: ['>=7']
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /tools/py
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
