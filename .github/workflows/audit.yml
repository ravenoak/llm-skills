name: audit

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@v7
      - run: npm --prefix tools/ts ci
      - id: npm-audit
        continue-on-error: true
        shell: bash
        run: npm --prefix tools/ts audit --audit-level=high --json | tee npm-audit.json
      - run: cd tools/py && uv sync
      - id: pip-audit
        continue-on-error: true
        shell: bash
        run: cd tools/py && uv run pip-audit --skip-editable --format json | tee ../../pip-audit.json
      - id: osv
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        continue-on-error: true
      - name: Combine audit reports
        if: failure() || steps.npm-audit.outcome == 'failure' || steps.pip-audit.outcome == 'failure' || steps.osv.outcome == 'failure'
        run: cat npm-audit.json pip-audit.json > audit-report.json || true
      - name: Open issue on failure
        if: failure() || steps.npm-audit.outcome == 'failure' || steps.pip-audit.outcome == 'failure' || steps.osv.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 'Weekly audit found issues'
          content-filepath: audit-report.json
          labels: security, audit
